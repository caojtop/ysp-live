services:
  ysp-live:
    image: ysp-live:9.5.1
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ysp-live
    restart: unless-stopped
    network_mode: host
    dns:
      - 223.5.5.5      # 阿里 DNS（国内解析极快）
      - 119.29.29.29  # 腾讯 DNS
      - 1.1.1.1        # 国际备用
    volumes:
      - ./data:/app/data
    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
      - YSP_DATA_DIR=/app/data
      # 凤凰卫视：留空=游客 480p；填 App.user.token=… 或只填 token 值 = 720p
      - FS_TOKEN=
      - NODE_OPTIONS="--max-old-space-size=256 --optimize-for-size"  # 优化 V8 内存与垃圾回收
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
